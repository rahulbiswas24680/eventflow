{% extends 'events/base.html' %}

{% block content %}

<section class="container py-3">
    <h1>Events Popular in India</h1>

    <div class="row row-cols-1 row-cols-md-3 g-4 mt-2">
    {% for event in events %}
    <div class="col">
        <div class="card h-100">
            <img src="https://images.pexels.com/photos/2747449/pexels-photo-2747449.jpeg?cs=srgb&dl=pexels-wolfgang-1002140-2747449.jpg&fm=jpg" class="card-img-top" alt="Event Image">
            <div class="card-body">
                <h5 class="card-title">{{ event.description }}</h5>
                <p class="card-text">{{ event.date }}</p>
                <p class="card-text">{{ event.location }}</p>
                <p class="card-text">{{ event.price }}</p>
                <p class="card-text">{{ event.category }}</p>
                <p class="card-text">{{ event.organizer }}</p>
                <a href="{% url 'event-detail' event.id %}" class="btn btn-primary">Let's Join</a>
            </div>
        </div>
    </div>
    {% endfor %}
</section>

{% endblock %}
