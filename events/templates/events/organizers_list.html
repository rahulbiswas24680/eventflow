{% block script %}
<script>
    function loadOrganizers() {
        const organizersList = document.getElementById('organizers-list');
        const token = localStorage.getItem('access_token');

        fetch('/api/user-profiles/organizers/', {
            headers: {
                'Authorization': `Bearer ${token}`
            }
        })
            .then(response => {
                if (!response.ok) throw new Error('Network response was not ok');
                return response.json();
            })
            .then(data => {
                organizersList.innerHTML = '';
                data.forEach(organizer => {
                    const card = `
<div class="col">
    <div class="card h-100 shadow-sm border-0">
        <div class="card-body">
            <!-- Organizer Name -->
            <h5 class="card-title d-flex align-items-center mb-3">
                <i class="bi bi-building me-2 text-success"></i>
                ${organizer.organizer_name || 'Unnamed Organizer'}
            </h5>

            <!-- Slug / Profile Link -->
            <p class="mb-2">
                <small class="text-muted">Profile:</small>
                <a href="${window.location.protocol}//${window.location.host}/${organizer.organizer_slug}" 
                   class="text-decoration-none text-primary fw-bold">
                    ${organizer.organizer_slug || 'No slug'}
                </a>
            </p>

            <!-- Email -->
            ${organizer.organizer_email ? `
            <p class="mb-2">
                <small class="text-muted"><i class="bi bi-envelope me-1"></i> Email:</small>
                <a href="mailto:${organizer.organizer_email}" class="text-decoration-none">
                    ${organizer.organizer_email}
                </a>
            </p>
            ` : ''}

            <!-- Phone -->
            ${organizer.organizer_phone ? `
            <p class="mb-2">
                <small class="text-muted"><i class="bi bi-telephone me-1"></i> Phone:</small>
                <a href="tel:${organizer.organizer_phone}" class="text-decoration-none">
                    ${organizer.organizer_phone}
                </a>
            </p>
            ` : ''}

            <!-- Address -->
            ${organizer.organizer_address ? `
            <p class="mb-2">
                <small class="text-muted"><i class="bi bi-geo-alt me-1"></i> Address:</small>
                <span class="d-block text-secondary">${organizer.organizer_address}</span>
            </p>
            ` : ''}

            <!-- Status -->
            <p class="mb-1">
                <small class="text-muted"><i class="bi bi-circle-fill text-${organizer.is_active ? 'success' : 'danger'} me-1"></i> 
                    ${organizer.is_active ? 'Active' : 'Inactive'}
                </small>
            </p>

            <!-- Created At -->
            <p class="mb-0">
                <small class="text-muted">
                    Created on ${new Date(organizer.created_at).toLocaleDateString()}
                </small>
            </p>
        </div>

        <!-- Footer: Edit & Delete -->
        <div class="card-footer bg-white border-top-0 pt-0">
            <div class="d-flex justify-content-between align-items-center">
                <small class="text-muted">
                    By: ${organizer.created_by_name || 'Admin'}
                </small>
                <div>
                    <a href="/organizers/edit/${organizer.id}/" 
                       class="btn btn-sm btn-outline-primary me-2">
                        <i class="bi bi-pencil"></i> Edit
                    </a>
                    <button class="btn btn-sm btn-outline-danger" 
                            onclick="deleteOrganizer(${organizer.id})">
                        <i class="bi bi-trash"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
`;
                    organizersList.innerHTML += card;
                });
            })
            .catch(error => {
                console.error('Error loading organizers:', error);
                organizersList.innerHTML = `
                <div class="col-12">
                    <div class="alert alert-danger">
                        Failed to load organizers. Please try refreshing the page.
                    </div>
                </div>
            `;
            });
    }

    document.addEventListener('DOMContentLoaded', function () {
        loadOrganizers();
    });

    function deleteOrganizer(id) {
        if (!confirm('Are you sure you want to delete this organizer?')) {
            return;
        }
        const token = localStorage.getItem('access_token');
        fetch(`/api/user-profiles/organizers/${id}/`, {
            method: 'DELETE',
            headers: {
                'Authorization': `Bearer ${token}`
            }
        })
            .then(res => {
                if (!res.ok) throw new Error('Delete failed');
                // Refresh the table
                loadOrganizers();
            })
            .catch(err => {
                alert('Error deleting organizer: ' + err);
            });
    }
</script>

{% endblock %}
