<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events</title>
    <!--Import Google Icon Font-->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Compiled and minified CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <!--Let browser know website is optimized for mobile-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <style>
        /* Sidebar Base Styles */
        .sidebar {
            width: 250px;
            transition: all 0.3s;
        }

        .sidebar ul {
            padding-left: 0;
        }

        .sidebar .nav-link {
            color: white;
            display: flex;
            align-items: center;
            padding: 10px;
            transition: background 0.3s;
        }

        .sidebar .nav-link i {
            font-size: 1.5rem;
        }

        .sidebar .nav-link:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }

        .sidebar .nav-link.active {
            background-color: rgba(0, 0, 0, 0.2);
        }

        .sidebar .sidebar-text {
            margin-left: 15px;
            font-size: 1.1rem;
        }

        /* Sidebar Shrinked (Icon Only) */
        #sidebar.shrinked {
            width: 80px;
        }

        #sidebar.shrinked .sidebar-text {
            display: none;
        }

        #sidebar.shrinked .nav-link {
            justify-content: center;
        }

        /* Hover Effect to Expand */
        #sidebar:hover {
            width: 250px;
        }

        /* Active & Hover State */
        #sidebar .nav-link:hover,
        #sidebar .nav-link.active {
            background-color: rgba(255, 255, 255, 0.2);
        }
    </style>
</head>

<body class="">

    {% include 'partials/navbar.html' %}

    <div class="d-flex">
        {% include 'partials/sidebar.html' %}
        <!-- Page content -->
        <main class="content p-5 w-100">
            {% block content %}{% endblock %}
        </main>
    </div>




    <!-- Compiled and minified JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>

    <script>
        document.getElementById('sidebar').addEventListener('mouseenter', function () {
            document.getElementById('sidebar').classList.remove('shrinked');
        });

        document.getElementById('sidebar').addEventListener('mouseleave', function () {
            document.getElementById('sidebar').classList.add('shrinked');
        });

    </script>
</body>

</html>
