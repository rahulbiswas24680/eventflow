<!-- offcanvas static for cart section -->
<div class="offcanvas offcanvas-end bg-sidebar-color" data-bs-backdrop="static" tabindex="-1" id="staticBackdrop"
  aria-labelledby="staticBackdropLabel">
  <div class="offcanvas-header">
    <h5 class="offcanvas-title" id="staticBackdropLabel">Your Cart</h5>
    <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
  </div>
  <div class="offcanvas-body">
    <div>
      <ul id="cart-items" class="list-group list-group-flush mb-auto">
        
      </ul>

      <hr>
      <div>

      </div>
    </div>
  </div>
</div>



<script>
  $(document).ready(function () {
    let cart = JSON.parse(sessionStorage.getItem('cart')) || [];


    function renderCartItems() {
      // Get cart items from sessionStorage
      let cart = JSON.parse(sessionStorage.getItem('cart')) || [];
      let cartItemsContainer = $('#cart-items');

      // Clear the container
      cartItemsContainer.empty();

      // Loop through cart items and append them to the list
      cart.forEach(item => {
        let itemHtml = `
                <li class="list-group-item">
                    <div class="d-flex justify-content-between">
                        <img class="img-thumbnail" style="width: 5rem;"
                            src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRlndpwDalSNF8TzBG6T7kGv73l0IOReNJpKw&s" alt="Product Image">
                        <div>
                            <h4>${item.name}</h4>
                            <p>Price: ₹${item.price}</p>
                            <p>Quantity: ${item.quantity}</p>
                        </div>
                    </div>
                </li>`;
        // Append item HTML to the cart items container
        cartItemsContainer.append(itemHtml);
      });
    }


    if (cart.length > 0) {
      $('#cart-count').text(cart.length);

      // Initial render of cart items
      renderCartItems();
    }
    console.log(cart);
  });

</script>
