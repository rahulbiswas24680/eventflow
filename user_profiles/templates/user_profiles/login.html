{% extends 'events/base.html' %}

{% block content %}

<div class="container-md py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">

            {% if demo_mode %}
            <div class="alert alert-info border-0 shadow-sm mb-3">
                <div class="d-flex align-items-center mb-2">
                    <i class="bi bi-shield-exclamation fs-4 me-2"></i>
                    <strong class="fs-6">Demo Credentials</strong>
                </div>
                <div class="small">
                    <div class="d-flex justify-content-between align-items-center py-2 border-bottom border-info border-opacity-25">
                        <span><i class="bi bi-person-fill me-1"></i>Attendee</span>
                        <code class="px-2 py-1 bg-white bg-opacity-50 rounded">demoattendee</code>
                        <code class="px-2 py-1 bg-white bg-opacity-50 rounded">demo@1234</code>
                    </div>
                    <div class="d-flex justify-content-between align-items-center py-2">
                        <span><i class="bi bi-person-fill-gear me-1"></i>Organizer</span>
                        <code class="px-2 py-1 bg-white bg-opacity-50 rounded">demoorganizer</code>
                        <code class="px-2 py-1 bg-white bg-opacity-50 rounded">demo@1234</code>
                    </div>
                </div>
            </div>
            {% endif %}

            <div class="card shadow">
                <div class="card-header bg-primary text-white text-center">
                    <h2 class="mb-0"><i class="bi bi-box-arrow-in-right me-2"></i>Login</h2>
                </div>
                <div class="card-body p-4">
                    <form method="post">
                        {% csrf_token %}
                        
                        <div class="mb-3">
                            <label for="username" class="form-label">Username or Email</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-person"></i></span>
                                <input type="text" class="form-control" id="username" name="username" required 
                                       placeholder="Enter your username or email">
                            </div>
                        </div>
                        
                        <div class="mb-4">
                            <label for="password" class="form-label">Password</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                <input type="password" class="form-control" id="password" name="password" required 
                                       placeholder="Enter your password">
                            </div>
                        </div>
                        
                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary btn-lg">
                                <i class="bi bi-box-arrow-in-right me-2"></i>Login
                            </button>
                        </div>
                    </form>
                </div>
                <div class="card-footer text-center">
                    <p class="mb-3">Don't have an account? <a href="{% url 'user-register' %}" class="text-decoration-none">Register here</a></p>
                </div>
            </div>
        </div>
    </div>
</div>

{% endblock %}
