{% extends 'events/base.html' %}

{% block content %}

<style>
.auth-page {
    min-height: calc(100vh - 56px);
    display: flex;
    align-items: center;
    justify-content: center;
    background:
        linear-gradient(135deg, rgba(0,0,0,0.65) 0%, rgba(0,0,0,0.35) 100%),
        url('https://images.pexels.com/photos/1190298/pexels-photo-1190298.jpeg') center/cover fixed;
    padding: 2rem 1rem;
}

.auth-card {
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(10px);
    border: none;
    border-radius: 16px;
    width: 100%;
    max-width: 440px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
}

.auth-card .card-header {
    background: transparent !important;
    color: #1a1a2e !important;
    border-bottom: 1px solid rgba(0,0,0,0.08);
    padding: 1.75rem 1.75rem 0;
    text-align: center;
}

.auth-card .card-header h2 {
    font-size: 1.5rem;
    font-weight: 700;
}

.auth-card .card-body {
    padding: 1.5rem 1.75rem 1.75rem;
}

.auth-card .card-footer {
    background: transparent;
    border-top: 1px solid rgba(0,0,0,0.08);
    padding: 1rem 1.75rem;
}

.auth-card .form-label {
    font-weight: 500;
    font-size: 0.875rem;
    color: #495057;
    margin-bottom: 0.3rem;
}

.auth-card .input-group-text {
    border: none;
    background: #f0f2f5;
    color: #6c757d;
}

.auth-card .form-control {
    border: 1px solid #e0e0e0;
    padding: 0.6rem 0.75rem;
    font-size: 0.9rem;
    border-radius: 8px;
}

.auth-card .form-control:focus {
    border-color: var(--eventflow-primary);
    box-shadow: 0 0 0 3px rgba(247, 147, 30, 0.15);
}

.auth-card .btn-primary {
    background: linear-gradient(135deg, var(--eventflow-primary), #e67e00);
    border: none;
    padding: 0.7rem;
    font-weight: 600;
    border-radius: 8px;
    transition: transform 0.2s, box-shadow 0.2s;
}

.auth-card .btn-primary:hover {
    transform: translateY(-1px);
    box-shadow: 0 4px 15px rgba(247, 147, 30, 0.4);
}

.demo-alert {
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(10px);
    border: none;
    border-radius: 12px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.2);
    max-width: 440px;
    width: 100%;
    margin-bottom: 1rem;
}
</style>

<div class="auth-page">
    <div class="d-flex flex-column align-items-center w-100" style="max-width: 440px;">
        {% if demo_mode %}
        <div class="demo-alert alert alert-info border-0 mb-3 p-3" role="alert">
            <div class="d-flex align-items-center mb-2">
                <i class="bi bi-shield-exclamation fs-5 me-2"></i>
                <strong class="fs-6">Demo Credentials</strong>
            </div>
            <div class="small">
                <div class="d-flex justify-content-between align-items-center py-1 border-bottom border-info border-opacity-25">
                    <span><i class="bi bi-person-fill me-1"></i>Attendee</span>
                    <code class="px-2 py-1 rounded" style="background:rgba(13,110,253,0.1)">demoattendee</code>
                    <code class="px-2 py-1 rounded" style="background:rgba(13,110,253,0.1)">demo@1234</code>
                </div>
                <div class="d-flex justify-content-between align-items-center py-1">
                    <span><i class="bi bi-person-fill-gear me-1"></i>Organizer</span>
                    <code class="px-2 py-1 rounded" style="background:rgba(13,110,253,0.1)">demoorganizer</code>
                    <code class="px-2 py-1 rounded" style="background:rgba(13,110,253,0.1)">demo@1234</code>
                </div>
            </div>
        </div>
        {% endif %}

        <div class="auth-card card">
            <div class="card-header">
                <h2><i class="bi bi-box-arrow-in-right me-2"></i>Welcome Back</h2>
                <p class="text-muted small mb-0 mt-1">Sign in to your EventFlow account</p>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label for="username" class="form-label">Username or Email</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-person"></i></span>
                            <input type="text" class="form-control" id="username" name="username" required
                                   placeholder="Enter your username or email">
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label">Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock"></i></span>
                            <input type="password" class="form-control" id="password" name="password" required
                                   placeholder="Enter your password">
                        </div>
                    </div>

                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary btn-lg">
                            <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
                        </button>
                    </div>
                </form>
            </div>
            <div class="card-footer text-center">
                <p class="mb-0 text-muted small">
                    Don't have an account?
                    <a href="{% url 'user-register' %}" class="text-decoration-none fw-semibold">Register here</a>
                </p>
            </div>
        </div>
    </div>
</div>

{% endblock %}
