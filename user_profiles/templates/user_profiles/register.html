{% extends 'events/base.html' %}

{% block content %}

<style>
.auth-page {
    min-height: calc(100vh - 56px);
    display: flex;
    align-items: center;
    justify-content: center;
    background:
        linear-gradient(135deg, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0.4) 100%),
        url('https://images.pexels.com/photos/167092/pexels-photo-167092.jpeg') center/cover fixed;
    padding: 2rem 1rem;
}

.auth-card {
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(10px);
    border: none;
    border-radius: 16px;
    width: 100%;
    max-width: 440px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
}

.auth-card .card-header {
    background: transparent !important;
    color: #1a1a2e !important;
    border-bottom: 1px solid rgba(0,0,0,0.08);
    padding: 1.75rem 1.75rem 0;
    text-align: center;
}

.auth-card .card-header h2 {
    font-size: 1.5rem;
    font-weight: 700;
}

.auth-card .card-body {
    padding: 1.5rem 1.75rem 1.75rem;
}

.auth-card .card-footer {
    background: transparent;
    border-top: 1px solid rgba(0,0,0,0.08);
    padding: 1rem 1.75rem;
}

.auth-card .form-label {
    font-weight: 500;
    font-size: 0.875rem;
    color: #495057;
    margin-bottom: 0.3rem;
}

.auth-card .input-group-text {
    border: none;
    background: #f0f2f5;
    color: #6c757d;
}

.auth-card .form-control {
    border: 1px solid #e0e0e0;
    padding: 0.6rem 0.75rem;
    font-size: 0.9rem;
    border-radius: 8px;
}

.auth-card .form-control:focus {
    border-color: var(--eventflow-primary);
    box-shadow: 0 0 0 3px rgba(247, 147, 30, 0.15);
}

.auth-card .btn-primary {
    background: linear-gradient(135deg, var(--eventflow-primary), #e67e00);
    border: none;
    padding: 0.7rem;
    font-weight: 600;
    border-radius: 8px;
    transition: transform 0.2s, box-shadow 0.2s;
}

.auth-card .btn-primary:hover {
    transform: translateY(-1px);
    box-shadow: 0 4px 15px rgba(247, 147, 30, 0.4);
}
</style>

<div class="auth-page">
    <div class="auth-card card">
        <div class="card-header">
            <h2><i class="bi bi-person-plus me-2"></i>Create Account</h2>
            <p class="text-muted small mb-0 mt-1">Join EventFlow to discover amazing events</p>
        </div>
        <div class="card-body">
            <form method="post">
                {% csrf_token %}

                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person"></i></span>
                        <input type="text" class="form-control" id="username" name="username" required placeholder="Choose a username">
                    </div>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                        <input type="email" class="form-control" id="email" name="email" required placeholder="Your email address">
                    </div>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label">Password</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                        <input type="password" class="form-control" id="password" name="password" required placeholder="Create a password">
                    </div>
                </div>

                <div class="d-grid">
                    <button type="submit" class="btn btn-primary btn-lg">
                        <i class="bi bi-person-plus me-2"></i>Create Account
                    </button>
                </div>
            </form>
        </div>
        <div class="card-footer text-center">
            <p class="mb-0 text-muted small">
                Already have an account?
                <a href="{% url 'user-login' %}" class="text-decoration-none fw-semibold">Login here</a>
            </p>
        </div>
    </div>
</div>

{% endblock %}
