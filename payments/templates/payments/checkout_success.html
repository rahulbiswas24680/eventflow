{% extends "events/base.html" %}
{% block content %}
<div class="container text-center py-5">
  <div class="card shadow-lg p-5 lg:mx-auto lg:w-50">
    <h1 class="text-success mb-4">
      <i class="bi bi-check-circle-fill"></i> Payment Successful!
    </h1>
    <p class="lead">Thank you for your purchase 🎉</p>

    {% if session_id %}
      <p><strong>Session ID:</strong> {{ session_id }}</p>
    {% endif %}

    <div id="qr-section" class="mt-4" style="display: none;">
      <h4>Your Ticket QR Code</h4>
      <img id="qr-image" src="" alt="Ticket QR Code" class="img-fluid mt-3" style="max-width: 250px;" />
    </div>

    <p class="mt-3">Your ticket confirmation will arrive shortly in your email.</p>

    <a href="{% url 'events-home' %}" class="btn btn-primary mt-4">
      <i class="bi bi-arrow-left"></i> Back to Events
    </a>
  </div>
</div>

<script>
$(document).ready(function(){
    var sessionId = "{{ session_id }}";

    if(sessionId){
        // Poll backend for QR code every 2s until ready
        function fetchQr(){
            $.ajax({
                url: "/api/payments/transaction-qr/?session_id=" + sessionId,
                method: "GET",
                success: function(res){
                    if(res.qr_url){
                        $("#qr-image").attr("src", res.qr_url);
                        $("#qr-section").show();
                    } else {
                        // keep polling until webhook processed
                        setTimeout(fetchQr, 2000);
                    }
                },
                error: function(){
                    setTimeout(fetchQr, 2000);
                }
            });
        }
        fetchQr();
    }
});
</script>

{% endblock %}
