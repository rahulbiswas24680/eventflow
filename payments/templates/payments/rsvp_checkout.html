{% extends "events/base.html" %}
{% block content %}

<div class="container py-3">
  <div class="row g-4">
    <div class="col-lg-5">
      <div class="rounded-4 p-4" style="background: #fff;">
        <h5 class="fw-bold mb-3"><i class="bi bi-receipt me-2"></i>Order Summary</h5>
        <div id="cart-boxes"></div>
        <hr class="my-3">
        <div class="d-flex justify-content-between mb-3 fw-bold fs-5">
          <span>Total</span>
          <span id="cart-total">₹0.00</span>
        </div>
      </div>
    </div>

    <div class="col-lg-7">
      <div class="rounded-4 p-4" style="background: #fff;">
        <h5 class="fw-bold mb-3"><i class="bi bi-person me-2"></i>Personal Details</h5>
        <form class="row g-3">
          <div class="col-md-6">
            <label for="inputEmail4" class="form-label">Email <span class="text-danger">*</span></label>
            <input type="email" class="form-control" id="inputEmail4" placeholder="abc@example.com" required>
          </div>
          <div class="col-md-6">
            <label for="inputPhone" class="form-label">Phone <span class="text-danger">*</span></label>
            <input type="tel" class="form-control" id="inputPhone" pattern="[0-9]{10}" placeholder="7890212212" maxlength="10" required>
          </div>
          <div class="col-12">
            <label for="inputAddress" class="form-label">Address <span class="text-danger">*</span></label>
            <textarea class="form-control" id="inputAddress" placeholder="1234 Main St" rows="2" required></textarea>
          </div>
          <div class="col-md-4">
            <label for="inputState" class="form-label">State <span class="text-danger">*</span></label>
            <select id="inputState" class="form-select" required>
              <option value="">Choose...</option>
            </select>
          </div>
          <div class="col-md-5">
            <label for="inputCity" class="form-label">City <span class="text-danger">*</span></label>
            <select id="inputCity" class="form-select" required>
              <option value="">Choose...</option>
            </select>
          </div>
          <div class="col-md-3">
            <label for="inputZip" class="form-label">Pincode <span class="text-danger">*</span></label>
            <input type="text" class="form-control" id="inputZip" placeholder="400001" maxlength="6" required>
          </div>
          <div class="col-12 d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 pt-3 border-top">
            <div class="d-flex align-items-center">
              <i class="bi bi-shield-check text-success fs-5 me-2"></i>
              <small class="text-muted">Secured by <strong>Stripe</strong></small>
            </div>
            {% csrf_token %}
            <meta name="csrf-token" content="{{ csrf_token }}">
            <button id="checkoutBtn" type="submit" class="btn btn-primary px-5 py-2 rounded-pill fw-bold">
              Pay Now <i class="bi bi-arrow-right ms-1"></i>
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<script>
$(document).ready(function () {
  let cartData = null;

  function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
      const cookies = document.cookie.split(';');
      for (let i = 0; i < cookies.length; i++) {
        const cookie = cookies[i].trim();
        if (cookie.substring(0, name.length + 1) === (name + '=')) {
          cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
          break;
        }
      }
    }
    return cookieValue;
  }

  function updateCartDisplay() {
    $.ajax({
      url: "{% url 'event-checkout' %}",
      method: "GET",
      success: function (data) {
        const subtotal = data.tickets.reduce((sum, item) => sum + (item.price * item.quantity), 0);
        const total = parseFloat(subtotal.toFixed(2));
        $('#cart-total').text('₹' + total.toFixed(2));

        const $cartItems = $('#cart-boxes');
        $cartItems.empty();
        cartData = data.tickets;

        if (data.tickets.length === 0) {
          $cartItems.append('<p class="text-muted text-center py-3 mb-0">Your cart is empty</p>');
          $('#checkoutBtn').prop('disabled', true);
        } else {
          $('#checkoutBtn').prop('disabled', false);
          data.tickets.forEach(item => {
            const price = Number(item.price);
            const html = [
              '<div class="d-flex justify-content-between align-items-start py-2 border-bottom">',
                '<div>',
                  '<h6 class="mb-0 small fw-semibold">' + item.name + '</h6>',
                  '<small class="text-muted">Qty: ' + item.quantity + ' × ₹' + price.toFixed(2) + '</small>',
                '</div>',
                '<strong class="small">₹' + (price * item.quantity).toFixed(2) + '</strong>',
              '</div>'
            ].join('');
            $cartItems.append(html);
          });
        }
      },
      error: function () {
        $('#cart-total').text('₹0.00');
        $('#checkoutBtn').prop('disabled', true);
        $('#cart-boxes').html('<p class="text-muted text-center py-3 mb-0">Your cart is empty</p>');
      }
    });
  }

  updateCartDisplay();

  $.ajaxSetup({
    beforeSend: function (xhr, settings) {
      if (!(/^GET|HEAD|OPTIONS|TRACE$/i.test(settings.type))) {
        xhr.setRequestHeader("X-CSRFToken", getCookie('csrftoken'));
      }
    }
  });

  function loadStates(countryName) {
    $.ajax({
      url: 'https://countriesnow.space/api/v0.1/countries/states',
      type: 'POST',
      contentType: 'application/json',
      data: JSON.stringify({ country: countryName }),
      dataType: 'json',
      success: function (response) {
        if (!response.error) {
          const $select = $('#inputState').empty().prop('disabled', false);
          $select.append('<option value="">-- Select State --</option>');
          response.data.states.forEach(function (state) {
            $select.append($('<option></option>').val(state.name).text(state.name));
          });
        }
      }
    });
  }

  function loadCities(countryName, stateName) {
    $.ajax({
      url: 'https://countriesnow.space/api/v0.1/countries/state/cities',
      type: 'POST',
      contentType: 'application/json',
      data: JSON.stringify({ country: countryName, state: stateName }),
      dataType: 'json',
      success: function (response) {
        if (!response.error) {
          const $select = $('#inputCity').empty().prop('disabled', false);
          $select.append('<option value="">-- Select City --</option>');
          response.data.forEach(function (cityName) {
            $select.append($('<option></option>').val(cityName).text(cityName));
          });
        }
      }
    });
  }

  $('#inputState').on('change', function () {
    const state = $(this).val();
    if (state) {
      $('#inputCity').prop('disabled', true).empty().append('<option value="">Loading...</option>');
      loadCities('India', state);
    } else {
      $('#inputCity').prop('disabled', true).empty().append('<option value="">-- Select City --</option>');
    }
  });

  loadStates('India');

  $("#checkoutBtn").on("click", function (e) {
    e.preventDefault();
    if ($(this).prop('disabled')) return;

    if (!$('#inputEmail4')[0].checkValidity() || !$('#inputPhone')[0].checkValidity() || !$('#inputAddress')[0].checkValidity()) {
      alert('Please fill in all required fields.');
      return;
    }

    const state = $('#inputState').val();
    const city = $('#inputCity').val();
    const zip = $('#inputZip').val().trim();
    if (!state || !city || !zip) {
      alert('Please fill in all required fields.');
      $('#checkoutBtn').prop('disabled', false).html('Pay Now <i class="bi bi-arrow-right ms-1"></i>');
      return;
    }

    $(this).prop('disabled', true).html('<span class="spinner-border spinner-border-sm me-2"></span>Processing...');

    $.ajax({
      url: "/api/payments/ticket-checkout-session/",
      method: "POST",
      contentType: "application/json",
      data: JSON.stringify({
        tickets: cartData.map(item => ({
          ticket_id: item.id,
          quantity: item.quantity
        })),
        email: $('#inputEmail4').val().trim(),
        phone: $('#inputPhone').val().trim(),
        address: $('#inputAddress').val().trim(),
        city: city,
        state: state,
        zip: zip
      }),
      success: function (data) {
        if (data.checkout_url) {
          window.location.href = data.checkout_url;
        } else {
          console.error("No checkout URL returned", data);
          alert('Something went wrong. Please try again.');
          $('#checkoutBtn').prop('disabled', false).html('Pay Now <i class="bi bi-arrow-right ms-1"></i>');
        }
      },
      error: function (xhr) {
        console.error("Checkout error:", xhr.responseText);
        alert('An error occurred. Please try again.');
        $('#checkoutBtn').prop('disabled', false).html('Pay Now <i class="bi bi-arrow-right ms-1"></i>');
      }
    });
  });
});
</script>

{% endblock %}
